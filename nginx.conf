# Regras de produção da landing do Hugo Netto na VPS.
# O TLS e o redirect http→https são do Traefik (Easypanel), na frente daqui.

# www → apex: servir os dois endereços sem escolher um divide o ranqueamento.
server {
    listen 80;
    server_name www.hugonetto.com;
    return 301 https://hugonetto.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # /assets tem hash no nome: imutável por um ano.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fotos otimizadas e logos não têm hash — 30 dias, o suficiente para o
    # visitante que volta e curto para uma troca de patrocinador aparecer.
    location ~ ^/(images|logos)/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Landing de página única: qualquer outro endereço é 404 de verdade.
    # Fallback para /index.html serviria a home com status 200 (soft 404) e o
    # Google manteria a URL indexada como duplicata.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";

        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
